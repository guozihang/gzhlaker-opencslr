SLOWFAST:
  ALPHA: 4
  BETA_INV: 8
  FUSION_CONV_CHANNEL_RATIO: 2
  FUSION_KERNEL_SZ: 5
  # 重构前(ebdb77f)的默认融合方式。SLOWFAST_64x2_R101_50_50.yaml 现在写的是
  # FuseBiAdd,两者参数集合不同(见 fuse_helper.py),旧 SlowFast checkpoint 必须用
  # 这一份才加载得上;这个文件只是那份的副本,只有 FUSE 一行不同。
  # 用法: model_args.slowfast_config: SLOWFAST_64x2_R101_50_50_FuseFastToSlow.yaml
  FUSE: FuseFastToSlow
RESNET:
  ZERO_INIT_FINAL_BN: True
  WIDTH_PER_GROUP: 64
  NUM_GROUPS: 1
  DEPTH: 101
  TRANS_FUNC: bottleneck_transform
  STRIDE_1X1: False
  NUM_BLOCK_TEMP_KERNEL: [[3, 3], [4, 4], [6, 6], [3, 3]]
  SPATIAL_DILATIONS: [[1, 1], [1, 1], [1, 1], [1, 1]]
  SPATIAL_STRIDES: [[1, 1], [2, 2], [2, 2], [2, 2]]
NONLOCAL:
  LOCATION: [[[], []], [[], []], [[], []], [[], []]]
  GROUP: [[1, 1], [1, 1], [1, 1], [1, 1]]
  INSTANTIATION: dot_product
  POOL: [[[2, 2, 2], [2, 2, 2]], [[2, 2, 2], [2, 2, 2]], [[2, 2, 2], [2, 2, 2]], [[2, 2, 2], [2, 2, 2]]]
MODEL:
  ARCH: slowfast
  MODEL_NAME: SlowFast
  DROPOUT_RATE: 0.5
