# 实验设置配置,按实验名分节。
# 运行方式: python main.py --config configs/exp.yaml --exp <name>
# 各实验通过 network: <name> 引用 network.yaml 中的网络配置。
# 以下带下划线的节仅用于 YAML anchor 复用,不会作为实验使用。

_common_optimizer_args: &common_optimizer_args
  optimizer: Adam
  base_lr: 0.0001
  step: [40, 60]
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: False

_common_feeder_args: &common_feeder_args
  mode: 'train'
  datatype: 'memmap'
  num_gloss: -1
  drop_ratio: 1.0
  frame_interval: 1
  image_scale: 1.0
  cache_file_lists: true
  cache_features: true
  precache_file_lists: false
  gpu_augment: true

_corrnet_optimizer_args: &corrnet_optimizer_args
  optimizer: Adam
  base_lr: 0.0001
  step: [20, 35]
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: False

_common_experiment: &common_experiment
  feeder: dataset.dataloader_video.VideoDataset
  phase: train
  num_epoch: 80
  batch_size: 2
  wandb:
    enable: true
    project: "openslr"
    entity: "gzhlaker"
  random_seed: 0
  test_batch_size: 2
  num_worker: 8
  eval_num_worker: 0
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  worker_threads: 1
  preopen_memmap: true
  gpu_prefetch: true
  length_bucket_size: 0
  log_interval: 200
  eval_interval: 1
  save_interval: 5
  optimizer_args: *common_optimizer_args
  feeder_args: *common_feeder_args

baseline:
  <<: *common_experiment
  network: slowfast
  dataset: phoenix2014
  work_dir: /share/huaiwen_group/work_dir/www2026_test_1/
  device: 0,1,2
  feeder_args:
    <<: *common_feeder_args
    skip_fileids:
      dev:
        - S004264_P0007_T00
      test:
        - S002001_P0007_T00

tlp:
  <<: *common_experiment
  network: tlp
  dataset: CSL-Daily
  work_dir: ./work_dir/tlp/
  device: 0

vac:
  <<: *common_experiment
  network: vac
  dataset: phoenix2014
  work_dir: ./work_dir/vac_smkd/
  device: 0,1,2

corrnet:
  <<: *common_experiment
  network: corrnet
  dataset: phoenix2014
  num_epoch: 40
  work_dir: ./work_dir/baseline_res18/
  num_worker: 10
  device: 0,1
  log_interval: 10000
  optimizer_args: *corrnet_optimizer_args
