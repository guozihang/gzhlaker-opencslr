# 网络相关配置,按网络名分节。
# exp.yaml 中各实验通过 network: <name> 引用对应网络。

_common_ctc_loss: &common_ctc_loss
  SeqCTC: 1.0
  ConvCTC: 1.0
  Dist: 25.0

slowfast:
  model: slowfast
  decode_mode: beam
  model_args:
    num_classes: 1296
    hidden_size: 1024
    c2d_type: slowfast101 #resnet18, mobilenet_v2, squeezenet1_1, shufflenet_v2_x1_0, efficientnet_b1, mnasnet1_0, regnet_y_800mf, vgg16_bn, vgg11_bn, regnet_x_800mf, regnet_x_400mf, densenet121, regnet_y_1_6gf
    conv_type: 2
    kernel_size: ['K5', "P2", 'K5', "P2"]
    use_bn: 1
    # SMKD
    share_classifier: 1
    weight_norm: True
    slowfast_config: SLOWFAST_64x2_R101_50_50.yaml
  loss_weights:
    <<: *common_ctc_loss
    Cu: 0.001
    Cp: 0.001
    Slow: 1.0
    Fast: 1.0

sen:
  model: sen
  decode_mode: beam
  model_args:
    # num_classes 要和训练时一致(这里沿用其他模型在 Phoenix2014 上的取值)。
    num_classes: 1296
    conv_type: 2
    stride: [4, 0]
    use_bn: 1
    # 时序卷积实现。旧代码(ebdb77f)的 SEN 用的是 MaxPool 版,已有的 SEN 权重都是按它
    # 训出来的,所以这里默认沿用 maxpool;要训练/评测当前代码的 LiftPool 版改成 liftpool。
    # kernel_size 由 conv_type 推得(maxpool 版与旧代码优先级一致:配了 conv_type 就忽略
    # kernel_size;liftpool 版则是没给 kernel_size 才用 conv_type)。
    temporal_conv: maxpool
  loss_weights:
    <<: *common_ctc_loss

tlp:
  model: tlp
  decode_mode: beam
  model_args:
    num_classes: 1
    c2d_type: resnet18
    kernel_size: ['K5', 'P2', 'K5', 'P2']
    stride: [4, 0]
    use_bn: 1
  loss_weights:
    <<: *common_ctc_loss
    Cu: 0.001
    Cp: 0.001

vac:
  model: vac
  decode_mode: beam
  model_args:
    num_classes: 1296
    c2d_type: resnet18
    kernel_size: ['K5', "P2", 'K5', "P2"]
    stride: [4, 0]
    use_bn: 1
  loss_weights:
    <<: *common_ctc_loss

corrnet:
  model: corrnet
  decode_mode: beam
  model_args:
    num_classes: 1296
    c2d_type: resnet18
    conv_type: 2
    kernel_size: ['K5', 'P2', 'K5', 'P2']
    use_bn: 1
    share_classifier: True
    weight_norm: True
  loss_weights:
    <<: *common_ctc_loss
