name: openslr
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python interpreter. scipy<1.3.0 (required by the legacy scipy.misc
  # imresize/imrotate code path in video_augmentation.py) only provides wheels
  # up to Python 3.7, so we pin 3.7 here for full compatibility.
  - python=3.7

  # Core deep learning (match CUDA 10.2+ / CPU-only accordingly)
  - pytorch>=1.8.0
  - torchvision>=0.9.0
  - cudatoolkit=10.2

  # Data / image / video
  - numpy
  - opencv
  - pillow
  - pandas

  # Augmentation / visualization
  - scipy<1.3.0
  - matplotlib

  # Config / progress / logging
  - pyyaml
  - tqdm

  # Packages not available on conda-forge / pytorch channels
  - pip
  - pip:
    - loguru
    - rich
    - fvcore
    - oss2
    - wandb

# CPU-only alternative for the PyTorch lines above:
#   - pytorch>=1.8.0
#   - torchvision>=0.9.0
#   - cpuonly
# (remove cudatoolkit and the `cpuonly` meta-package is mutually exclusive with it)
